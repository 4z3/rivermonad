# foot configuration (man foot.ini). New terminals pick up changes;
# check it with:  foot --check-config
#
# Font size on the fly in a running terminal:
#   Ctrl+=  bigger   Ctrl+-  smaller   Ctrl+0  back to this size

[main]
# "family:size=N". Sizes are in points and follow the monitor scale
# (kanshi), so with scale 4 they already look 4x bigger.
# Installed monospace fonts: DejaVu Sans Mono, Liberation Mono,
# Noto Sans Mono (list them with: fc-list :spacing=mono family)
font=monospace:size=10.5

# Space between the text and the window border, in pixels.
pad=4x4

[key-bindings]
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

