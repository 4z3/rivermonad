# fuzzel, styled like macOS Spotlight with the Nord colours (man fuzzel.ini).
# Open it with Super+P; type to search apps, Enter to launch, Esc to close.
[main]
font=sans:size=13
prompt=" "
placeholder=Search
icons-enabled=yes
anchor=center
width=44
lines=8
horizontal-pad=20
vertical-pad=16
inner-pad=12
line-height=26
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=2e3440f2
text=d8dee9ff
placeholder=4c566aff
prompt=88c0d0ff
input=eceff4ff
match=88c0d0ff
selection=3b4252ff
selection-text=eceff4ff
selection-match=88c0d0ff
counter=4c566aff
border=88c0d0aa

[border]
width=1
radius=16
